apiVersion: apps/v1
kind: Deployment
metadata:
  name: uzelok
  namespace: uzelok
  labels:
    app.kubernetes.io/name: uzelok
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uzelok
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uzelok
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uzelok
          image: uzelok:0.1.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: uzelok-secrets
          env:
            - name: UZELOK_ARTIFACTS_DIR
              value: /var/lib/uzelok/artifacts
            - name: UZELOK_VAULTS_DIR
              value: /var/lib/uzelok/vaults
            - name: UZELOK_EXPORTS_DIR
              value: /var/lib/uzelok/exports
            - name: UZELOK_KNOWLEDGE_LINT_COMMAND
              value: python3 /opt/uzelok/lint/agora_lint.py
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/uzelok
            - name: vault-agora
              mountPath: /mnt/hdd/workspace/agora
            - name: lint
              mountPath: /opt/uzelok/lint
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uzelok-data
        - name: vault-agora
          hostPath:
            path: /mnt/hdd/workspace/agora
            type: Directory
        - name: lint
          configMap:
            name: uzelok-lint
        - name: tmp
          emptyDir: {}
