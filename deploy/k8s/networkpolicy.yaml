# Сетевая изоляция namespace uzelok по шаблону hector-k8s/app-namespace-policies.yaml.
# Ingress: default-deny + только свои поды (входящих портов у сервиса нет, правило Traefik не нужно).
# Egress: свои поды, DNS kube-system:53, PostgreSQL infra-shared:5432, интернет без LAN/tailnet.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: uzelok
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: uzelok
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-shared
      ports:
        - protocol: TCP
          port: 5432
    # Интернет есть, домашняя LAN и tailnet — нет.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # кластерные и внутренние 10/8 (вкл. 10.42/10.43)
              - 172.16.0.0/12    # RFC1918
              - 192.168.0.0/16   # домашняя LAN
              - 169.254.0.0/16   # link-local / metadata
              - 100.64.0.0/10    # CGNAT, подсеть Tailscale (на будущее)
