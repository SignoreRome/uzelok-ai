# Пример структуры Secret. В git не коммитить реальные значения.
# Реальный Secret создаётся вручную из ~/.hermes/secrets.env:
#   kubectl -n uzelok create secret generic uzelok-secrets --from-env-file=...
apiVersion: v1
kind: Secret
metadata:
  name: uzelok-secrets
  namespace: uzelok
type: Opaque
stringData:
  UZELOK_DB_URL: ""
  UZELOK_DB_USER: ""
  UZELOK_DB_PASSWORD: ""
  UZELOK_BOT_TOKEN: ""
  UZELOK_BOT_USERNAME: ""
  UZELOK_TELEGRAM_PROXY: ""
  UZELOK_LLM_PROXY: ""
  UZELOK_LLM_OPENCODE_GO_KEY: ""
  UZELOK_LLM_OPENROUTER_KEY: ""
