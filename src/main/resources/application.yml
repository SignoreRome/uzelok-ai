spring:
  main:
    web-application-type: none
  datasource:
    url: ${UZELOK_DB_URL}
    username: ${UZELOK_DB_USER}
    password: ${UZELOK_DB_PASSWORD}
  flyway:
    enabled: true
uzelok:
  telegram:
    bot-token: ${UZELOK_BOT_TOKEN}
    bot-username: ${UZELOK_BOT_USERNAME}
    proxy-url: ${UZELOK_TELEGRAM_PROXY:}
    poll-timeout-seconds: 30
    media-group-window-ms: 2000
    max-text-chars: 8000
    max-photo-bytes: 15728640
    max-document-bytes: 1048576
    max-image-pixels: 30000000
  storage:
    artifacts-dir: ${UZELOK_ARTIFACTS_DIR:/var/lib/uzelok/artifacts}
    vaults-dir: ${UZELOK_VAULTS_DIR:/var/lib/uzelok/vaults}
    exports-dir: ${UZELOK_EXPORTS_DIR:/var/lib/uzelok/exports}
  limits:
    jobs-per-day: 20
    jobs-per-hour: 5
    attachment-ttl-hours: 72
  llm:
    providers:
      openrouter:
        base-url: https://openrouter.ai/api/v1
        api-key: ${UZELOK_LLM_OPENROUTER_KEY:}
      opencode-go:
        base-url: https://opencode.ai/zen/go/v1
        api-key: ${UZELOK_LLM_OPENCODE_GO_KEY:}
    steps:
      extract:
        provider: opencode-go
        model: claude-haiku-5-5
        fallback-model: gemini-4-argon
      draft:
        provider: opencode-go
        model: gemini-4-argon
        fallback-model: deepseek-v4.1-flash
    pricing:
      "[opencode-go/deepseek-v4.1-flash]":
        input-per-million: 0.30
        output-per-million: 1.20
      "[opencode-go/gemini-4-argon]":
        input-per-million: 2.00
        output-per-million: 10.00
      "[opencode-go/claude-haiku-5-5]":
        input-per-million: 0.10
        output-per-million: 0.50
    prompt-version: v2
    daily-budget-usd: 2.00
    timeout-seconds: 120
    proxy-url: ${UZELOK_LLM_PROXY:}
  knowledge:
    # Линтер запускается только для внешней базы с контрактом.
    lint-command: ""
    lint-timeout-seconds: 60
    lint-parity-fixtures: src/test/resources/lint-fixtures
    confidence-threshold: 0.55
    max-file-name-length: 60
    export-max-bytes: 50000000
    export-max-files: 5000
  worker:
    lease-minutes: 10
    max-attempts: 3
    poll-interval-ms: 2000
  otel:
    enabled: false
  debug:
    dump-artifacts: false
logging:
  level:
    root: INFO
    uzelok: DEBUG
