help.text=Отправьте текст, фото или документ .txt/.md — я соберу из него заметку.\nЕсли базы знаний ещё нет, создайте новую в Uzelok или подключите существующую по контракту.\n/export — пришлю архив базы, созданной в Uzelok: zip с README.md и каталогом notes/.
start.text=Привет! Отправьте текст, фото или документ .txt/.md — я соберу из него заметку.\nЕсли базы знаний ещё нет, я предложу создать её в Uzelok или подключить существующую по контракту.\n/export — скачать базу, созданную в Uzelok: zip с README.md и каталогом notes/.
