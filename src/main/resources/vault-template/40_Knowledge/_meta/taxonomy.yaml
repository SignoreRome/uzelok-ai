# Словарь хранилища знаний: домен → тема.
# Владелец: человек. Домены меняются редко; темы растут. Модель темы не создаёт:
# при промахе заметка уходит в _Inbox, новую тему создаёт нажатие в превью Telegram.
# contract_version меняется вместе с _meta/CONTRACT.md и требует миграции заметок.

contract_version: 2
inbox_folder: _Inbox
meta_folder: _meta

# id      — имя папки (регистр и подчёркивания значимы)
# aliases — как домен/тему может назвать человек или классификатор
# scope   — что сюда относится; используется человеком и промптом классификатора
domains:
  - id: Algorithms
    aliases: [algo, algorithms, dsa, алгоритмы, структуры_данных]
    scope: "Алгоритмы и структуры данных: приёмы, сложность, разборы задач"
    topics:
      - id: Two_Pointers
        aliases: [two_pointers, два_указателя]
        scope: "Два указателя: отсортированные массивы, палиндромы, свёртки, удаление дублей"
      - id: Sliding_Window
        aliases: [sliding_window, окно]
        scope: "Скользящее окно: подмассивы и подстроки фиксированной и переменной длины"
      - id: Binary_Search
        aliases: [binary_search, бинпоиск]
        scope: "Бинарный поиск по значению и по ответу, границы поиска, повороты"
      - id: Prefix_Sums
        aliases: [prefix_sums, префиксные_суммы, difference_array]
        scope: "Префиксные суммы, разностные массивы, 2D-префиксы"
      - id: Hashing
        aliases: [hashing, hash_map, хеш_таблицы]
        scope: "Хеш-таблицы и множества, подсчёт частот, группировка"
      - id: Sorting
        aliases: [sorting, сортировка]
        scope: "Сортировки, компараторы, устойчивость, выбор алгоритма"
      - id: Linked_List
        aliases: [linked_list, связный_список]
        scope: "Связные списки: разворот, слияние, циклы, быстрый и медленный указатель"
      - id: Trees
        aliases: [trees, binary_tree, bst, деревья]
        scope: "Деревья: обходы, BST, балансировка, LCA"
      - id: Graphs
        aliases: [graphs, bfs, dfs, графы]
        scope: "Графы: обходы, топологическая сортировка, кратчайшие пути, компоненты"
      - id: Dynamic_Programming
        aliases: [dp, dynamic_programming, дп]
        scope: "Динамическое программирование: состояния, переходы, оптимизация памяти"
      - id: Greedy
        aliases: [greedy, жадные]
        scope: "Жадные алгоритмы и доказательства корректности"
      - id: Backtracking
        aliases: [backtracking, перебор]
        scope: "Перебор с возвратом: подмножества, перестановки, обрезка"
      - id: Heaps
        aliases: [heaps, priority_queue, кучи]
        scope: "Кучи и приоритетные очереди: top-K, слияние потоков, медиана"
      - id: Strings
        aliases: [strings, строки, kmp, trie]
        scope: "Строки: поиск подстрок, KMP, Z-функция, trie, палиндромы"
      - id: Bit_Manipulation
        aliases: [bits, bit_manipulation, биты]
        scope: "Битовые операции, маски, подмножества через маски"

  - id: Java
    aliases: [java, jvm, spring, spring_boot]
    scope: "Язык, стандартная библиотека, JVM, Spring Boot, сборка"
    topics:
      - id: Core_Language
        aliases: [core_java, язык, syntax, oop]
        scope: "Синтаксис, ООП, records, sealed, generics, исключения, основы коллекций"
      - id: Collections
        aliases: [collections, коллекции]
        scope: "List/Map/Set, реализации, сложность, equals и hashCode"
      - id: Concurrency
        aliases: [concurrency, threads, virtual_threads, конкурентность]
        scope: "Потоки, виртуальные потоки, пулы, synchronized, CompletableFuture"
      - id: JVM_Memory_GC
        aliases: [jvm, gc, memory, память, сборка_мусора]
        scope: "Модель памяти, GC (G1, ZGC), утечки, тюнинг heap"
      - id: Spring_Boot
        aliases: [spring, spring_boot, spring_ai]
        scope: "Spring Boot и Spring AI: контекст, конфигурация, транзакции, HTTP-клиенты"
      - id: Gradle_Build
        aliases: [gradle, build, сборка]
        scope: "Gradle Kotlin DSL, мультимодульность, версии, Jib"

  - id: Networks
    aliases: [networks, networking, сети, tcp_ip]
    scope: "Сети: модели, протоколы, адресация, транспорт, прикладной уровень"
    topics:
      - id: OSI_TCP_IP
        aliases: [osi, tcp_ip, уровни]
        scope: "Модели OSI и TCP/IP, инкапсуляция, где что живёт"
      - id: TCP_Handshake
        aliases: [tcp, handshake, транспорт]
        scope: "TCP: установка и закрытие соединения, окна, повторы, keepalive"
      - id: DNS
        aliases: [dns, домены]
        scope: "DNS: резолвинг, типы записей, кеши, split-horizon"
      - id: HTTP
        aliases: [http, https, rest, api]
        scope: "HTTP/1.1, HTTP/2, HTTP/3, коды, кеширование, заголовки"
      - id: TLS
        aliases: [tls, ssl, сертификаты]
        scope: "TLS: рукопожатие, сертификаты, цепочки доверия, pinning"
      - id: Routing_Switching
        aliases: [routing, switching, vlan, маршрутизация]
        scope: "Коммутация, маршрутизация, VLAN, NAT, подсети"
      - id: VPN_Tunnels
        aliases: [vpn, tailscale, wireguard, туннели]
        scope: "VPN и оверлеи: WireGuard, Tailscale, mesh-сети, MTU"
      - id: Sockets
        aliases: [sockets, сокеты]
        scope: "Сокеты, блокирующий и неблокирующий ввод-вывод, epoll"

  - id: English
    aliases: [english, английский, language]
    scope: "Английский язык: грамматика, лексика, произношение, речь"
    topics:
      - id: Grammar_Tenses
        aliases: [tenses, времена, grammar]
        scope: "Времена и аспекты: Present Perfect, Past Simple, условные конструкции"
      - id: Grammar_Articles
        aliases: [articles, артикли, determiners]
        scope: "Артикли, детерминативы, исчисляемость"
      - id: Grammar_Prepositions
        aliases: [prepositions, предлоги]
        scope: "Предлоги места, времени, зависимые предлоги"
      - id: Phrasal_Verbs
        aliases: [phrasal_verbs, фразовые_глаголы]
        scope: "Фразовые глаголы и их значения в контексте"
      - id: Vocabulary
        aliases: [vocabulary, лексика, words]
        scope: "Лексика по темам, словообразование, ложные друзья переводчика"
      - id: Collocations
        aliases: [collocations, коллокации]
        scope: "Устойчивые сочетания и естественные формулировки"
      - id: Pronunciation
        aliases: [pronunciation, произношение, phonetics]
        scope: "Звуки, ударение, связная речь"
      - id: Speaking_Patterns
        aliases: [speaking, talking, речь]
        scope: "Речевые конструкции и клише для беседы и интервью"

  - id: AI_ML
    aliases: [ai, ml, llm, агенты, ии]
    scope: "LLM, RAG, агенты, оркестрация моделей, оценка качества"
    topics:
      - id: LLM_Routing
        aliases: [model_routing, routing, роутинг]
        scope: "Выбор модели под задачу, cost-aware routing, роутеры и политики"
      - id: Coding_Agents
        aliases: [agents, coding_agents, harness]
        scope: "Агенты и harness'ы: архитектура, профили, sandbox, наблюдаемость"
      - id: RAG
        aliases: [rag, retrieval]
        scope: "Retrieval-Augmented Generation: чанкинг, гибридный поиск, реранк"
      - id: Embeddings
        aliases: [embeddings, векторы, pgvector]
        scope: "Модели эмбеддингов, размерности, оценка качества поиска"
      - id: Model_Evaluation
        aliases: [evals, benchmarks, оценка]
        scope: "Замеры и бенчмарки моделей, собственные eval-наборы"

  - id: Architecture
    aliases: [architecture, design, архитектура]
    scope: "Архитектура сервисов и модулей, границы, моделирование данных"
    topics:
      - id: Patterns
        aliases: [patterns, паттерны]
        scope: "Архитектурные и интеграционные паттерны, их цена"
      - id: Modular_Monolith
        aliases: [monolith, modular_monolith, монолит]
        scope: "Модульный монолит: границы модулей, эволюция в сервисы"
      - id: Data_Modeling
        aliases: [data_modeling, схема, db_design]
        scope: "Моделирование данных, нормализация, ключи, JSONB против таблиц"
      - id: Event_Driven
        aliases: [events, event_driven, outbox]
        scope: "Событийные контракты, идемпотентность, exactly-once в реальности"

  - id: Infrastructure
    aliases: [infra, devops, инфраструктура]
    scope: "Linux, k3s, CI/CD, сети хоста, хранилища, наблюдаемость"
    topics:
      - id: GitHub_Actions
        aliases: [github_actions, ci_cd, runners]
        scope: "GitHub Actions: workflow, self-hosted раннеры, ARC, лимиты"
      - id: Kubernetes_k3s
        aliases: [kubernetes, k3s, k8s]
        scope: "k3s: объекты, сеть, хранилища, Helm, обновления"
      - id: Linux_Systemd
        aliases: [linux, systemd, сервисы]
        scope: "systemd-юниты и таймеры, журналы, права, пакеты"
      - id: Backups_Storage
        aliases: [backups, s3, storage, бэкапы]
        scope: "Резервное копирование, S3, LVM, файловые системы"
      - id: Observability
        aliases: [observability, metrics, traces, логи]
        scope: "Метрики, трейсы, логи, алерты, OpenTelemetry"

  - id: Kafka
    aliases: [kafka, streaming, стриминг]
    scope: "Kafka и потоковая обработка"
    topics:
      - id: KRaft
        aliases: [kraft, broker, controller]
        scope: "KRaft, кворум контроллеров, репликация, конфигурация брокера"
      - id: Delivery_Guarantees
        aliases: [delivery, at_least_once, exactly_once]
        scope: "Гарантии доставки, идемпотентный продюсер, транзакции"
      - id: Outbox
        aliases: [outbox, transactional_outbox]
        scope: "Transactional Outbox: схема, поллинг, публикация"
      - id: Streams
        aliases: [streams, consumer_groups]
        scope: "Consumer groups, ребалансировка, обработка потоков"

  - id: Learning_Science
    aliases: [learning, pedagogy, обучение]
    scope: "Как учиться: повторение, память, планирование"
    topics:
      - id: FSRS
        aliases: [fsrs, spaced_repetition, интервальное_повторение]
        scope: "Алгоритмы интервального повторения, параметры, целевая retention"
      - id: Memory_Models
        aliases: [memory, память, forgetting_curve]
        scope: "Модели памяти, кривая забывания, интерференция"
      - id: Curriculum_Design
        aliases: [curriculum, roadmap, план_обучения]
        scope: "Построение траекторий обучения, порядок тем, проверка знаний"

  - id: Postgres
    aliases: [postgres, postgresql, sql]
    scope: "PostgreSQL и работа с данными"
    topics:
      - id: Indexing
        aliases: [indexes, индексы, btree]
        scope: "B-tree, GIN, HNSW, планы запросов, EXPLAIN"
      - id: Transactions
        aliases: [transactions, mvcc, блокировки]
        scope: "Транзакции, уровни изоляции, MVCC, блокировки, дедлоки"
      - id: Migrations
        aliases: [flyway, migrations, миграции]
        scope: "Миграции схемы, обратная совместимость, безопасные изменения"
      - id: Pgvector
        aliases: [pgvector, vectors, hnsw]
        scope: "pgvector: типы, индексы, параметры поиска, гибридные запросы"
